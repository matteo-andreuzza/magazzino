name: magazzino-sagra

x-db-env: &db-env
  POSTGRES_DB: magazzino
  POSTGRES_USER: magazzino
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magazzino}

# Sincronia tra la sagra e il server di casa (vedi docs/MANUTENZIONE.md, «Sincronia con casa»):
# SERVER_NOME sagra o casa, la stessa COPIA_CHIAVE sui due server, SINCRONIA_CON solo sulla sagra.
x-sincronia-env: &sincronia-env
  SERVER_NOME: ${SERVER_NOME:-sagra}
  COPIA_CHIAVE: ${COPIA_CHIAVE:-}
  SINCRONIA_CON: ${SINCRONIA_CON:-}
  SINCRONIA_OGNI_SECONDI: ${SINCRONIA_OGNI_SECONDI:-30}

# «always»: quando torna la corrente (o si riaccende il computer) ripartono da soli, anche se
# prima qualcuno li aveva fermati con «docker compose stop».

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      <<: *db-env
      TZ: Europe/Rome
    volumes:
      - db_dati:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magazzino -d magazzino"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    image: magazzino-sagra:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: [*db-env, *sincronia-env]
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_NOME: ${APP_NOME:-Magazzino Sagra}
      BACKUP_OGNI_MINUTI: ${BACKUP_OGNI_MINUTI:-30}
    ports:
      - "${PORTA:-8000}:8000"
    volumes:
      - app_dati:/app/dati
      # Per il pannello del sistema (/sistema/): i backup e lo stato di backup e drive.
      - ./backup:/backup:ro
      - stato:/stato:ro

  # Manda comande e ricevute alle stampanti di rete della sagra (cassa/servizio_stampa.py).
  # Parte da solo con il resto: sui computer e sui tablet della cassa non c'è niente da avviare.
  # Le stampanti devono essere nella stessa rete del computer su cui gira l'app.
  stampa:
    build: .
    image: magazzino-sagra:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      APP_NOME: ${APP_NOME:-Magazzino Sagra}
      # A casa (SERVER_NOME=casa) il servizio resta acceso ma non stampa.
      SERVER_NOME: ${SERVER_NOME:-sagra}
    # Niente migrazioni qui (le fa «web»): finché il database non è pronto il servizio aspetta da solo.
    entrypoint: ["python", "manage.py"]
    command: ["servizio_stampa", "--file-vivo", "/tmp/servizio-stampa-vivo"]
    volumes:
      - app_dati:/app/dati
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/servizio-stampa-vivo -mmin -1 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Ogni 30 minuti copia database e allegati in ./backup. Le copie del database
  # restano 10 giorni; i nomi iniziano con il nome del progetto (magazzino-sagra),
  # così non si confondono con quelli di altre installazioni sullo stesso computer.
  # Ogni quanto e per quanti giorni si cambiano nel file .env (BACKUP_OGNI_MINUTI, BACKUP_GIORNI).
  backup:
    image: postgres:17-alpine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: magazzino
      PGDATABASE: magazzino
      PGPASSWORD: ${POSTGRES_PASSWORD:-magazzino}
      PROGETTO: ${COMPOSE_PROJECT_NAME}
      OGNI_MINUTI: ${BACKUP_OGNI_MINUTI:-30}
      GIORNI: ${BACKUP_GIORNI:-10}
      TZ: Europe/Rome
    volumes:
      - ./backup:/backup
      - app_dati:/dati:ro
      - stato:/stato
    entrypoint: ["/bin/sh", "-c"]
    # Lo stato (per il pannello del sistema) va in /stato/backup, righe chiave=valore.
    command:
      - |
        set -o pipefail
        avviato=$$(date -Iseconds); ultimo_ok=""; ultimo_file=""; ultimo_errore=""; errore_il=""
        scrivi_stato() {
          printf 'avviato=%s\nultimo_ok=%s\nultimo_file=%s\nultimo_errore=%s\nerrore_il=%s\nprossimo=%s\n' \
            "$$avviato" "$$ultimo_ok" "$$ultimo_file" "$$ultimo_errore" "$$errore_il" \
            "$$(date -Iseconds -d @$$(( $$(date +%s) + OGNI_MINUTI * 60 )))" > /stato/backup.tmp \
            && mv /stato/backup.tmp /stato/backup
        }
        while true; do
          nome="/backup/$$PROGETTO-$$(date +%Y%m%d-%H%M).sql.gz"
          if pg_dump --no-owner --clean --if-exists 2>/tmp/errore | gzip > "$$nome.tmp"; then
            mv "$$nome.tmp" "$$nome"
            echo "Backup salvato: $$nome"
            ultimo_ok=$$(date -Iseconds); ultimo_file=$$(basename "$$nome")
          else
            rm -f "$$nome.tmp"
            echo "ATTENZIONE: backup non riuscito"
            ultimo_errore=$$(head -c 200 /tmp/errore | tr '\n' ' '); errore_il=$$(date -Iseconds)
          fi
          # Un allegato non cambia più dopo il caricamento: si copiano solo quelli nuovi,
          # saltando quelli dell'ultimo minuto che potrebbero essere ancora in scrittura.
          if [ -d /dati/allegati ]; then
            (cd /dati/allegati && find . -type f -mmin +1) | while IFS= read -r file; do
              copia="/backup/$$PROGETTO-allegati/$${file#./}"
              if [ ! -e "$$copia" ]; then
                mkdir -p "$$(dirname "$$copia")" \
                  && cp -p "/dati/allegati/$$file" "$$copia.tmp" \
                  && mv "$$copia.tmp" "$$copia" \
                  || echo "ATTENZIONE: copia non riuscita di $$file"
              fi
            done
          fi
          find /backup -maxdepth 1 -name "$$PROGETTO-*.sql.gz" -mtime +$$GIORNI -delete
          scrivi_stato
          sleep $$((OGNI_MINUTI * 60))
        done

  # Carica su Google Drive quello che c'è in ./backup. Facoltativo: finché non
  # è configurato (vedi docs/MANUTENZIONE.md, "Google Drive") non fa niente.
  # Senza internet riprova da solo e recupera i file rimasti indietro.
  drive:
    image: rclone/rclone:1.75.1
    restart: always
    environment:
      PROGETTO: ${COMPOSE_PROJECT_NAME}
      DRIVE_CARTELLA: ${DRIVE_CARTELLA:-Backup magazzino sagra}
      DRIVE_GIORNI: ${DRIVE_GIORNI:-30}
      TZ: Europe/Rome
    volumes:
      - ./backup:/backup:ro
      - ./rclone:/config/rclone
      - stato:/stato
    entrypoint: ["/bin/sh", "-c"]
    # Lo stato (per il pannello del sistema) va in /stato/drive: spento, ok o errore.
    command:
      - |
        set -o pipefail
        stato=""; avviato=$$(date -Iseconds); ultimo_ok=""
        while true; do
          if ! rclone listremotes 2>/dev/null | grep -qx "drive:"; then
            [ "$$stato" = "spento" ] || echo "Google Drive non configurato: i backup restano solo in ./backup."
            stato="spento"
          # Del registro di rclone si tengono solo i file copiati e l'eventuale errore finale.
          elif rclone mkdir "drive:$$DRIVE_CARTELLA" --retries 1 --log-level NOTICE \
               && rclone copy /backup "drive:$$DRIVE_CARTELLA" \
                 --filter "- *.tmp" --filter "+ /$$PROGETTO-*.sql.gz" --filter "+ /$$PROGETTO-allegati/**" --filter "- **" \
                 --retries 1 --stats 0 --log-level INFO 2>&1 | { grep -E "Copied|Failed" || true; }; then
            # Su Drive le copie del database si tengono più a lungo che sul computer.
            rclone delete "drive:$$DRIVE_CARTELLA" --filter "+ /$$PROGETTO-*.sql.gz" --filter "- **" \
              --min-age "$${DRIVE_GIORNI}d" --log-level NOTICE
            [ "$$stato" = "ok" ] || echo "Google Drive collegato: i backup vanno nella cartella «$$DRIVE_CARTELLA»."
            stato="ok"
          else
            [ "$$stato" = "errore" ] || echo "ATTENZIONE: copia su Google Drive non riuscita (manca internet?). Riprovo ogni 10 minuti."
            stato="errore"
          fi
          [ "$$stato" = "ok" ] && ultimo_ok=$$(date -Iseconds)
          printf 'stato=%s\navviato=%s\nultimo_ok=%s\ntentativo_il=%s\ncartella=%s\n' \
            "$$stato" "$$avviato" "$$ultimo_ok" "$$(date -Iseconds)" "$$DRIVE_CARTELLA" > /stato/drive.tmp \
            && mv /stato/drive.tmp /stato/drive
          sleep 600
        done

  # Solo sulla sagra: ogni 30 secondi, quando c'è internet, manda a casa le modifiche di qui e
  # prende quelle di casa (sistema/sincronia.py). Si accende con COMPOSE_PROFILES=sincronia nel
  # file .env, insieme a SINCRONIA_CON e COPIA_CHIAVE. Allo spegnimento fa un ultimo giro.
  sincronia:
    profiles: ["sincronia"]
    build: .
    image: magazzino-sagra:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 60s
    environment:
      <<: [*db-env, *sincronia-env]
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      APP_NOME: ${APP_NOME:-Magazzino Sagra}
    # Niente migrazioni qui (le fa «web»): finché il database non è pronto il servizio aspetta da solo.
    entrypoint: ["python", "manage.py"]
    command: ["sincronia"]
    volumes:
      - app_dati:/app/dati
      # Prima di riallinearsi da casa salva qui una copia di sicurezza dei dati della sagra.
      - ./backup:/backup
    healthcheck:
      disable: true

volumes:
  db_dati:
  app_dati:
  # Stato dei servizi backup e drive, letto dal pannello del sistema.
  stato:
