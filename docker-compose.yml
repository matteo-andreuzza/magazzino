name: magazzino-sagra

x-db-env: &db-env
  POSTGRES_DB: magazzino
  POSTGRES_USER: magazzino
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magazzino}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
      TZ: Europe/Rome
    volumes:
      - db_dati:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magazzino -d magazzino"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    image: magazzino-sagra:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_NOME: ${APP_NOME:-Magazzino Sagra}
    ports:
      - "${PORTA:-8000}:8000"
    volumes:
      - app_dati:/app/dati

  # Ogni 30 minuti copia database e allegati in ./backup. Le copie del database
  # restano 10 giorni; i nomi iniziano con il nome del progetto (magazzino-sagra),
  # così non si confondono con quelli di altre installazioni sullo stesso computer.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: magazzino
      PGDATABASE: magazzino
      PGPASSWORD: ${POSTGRES_PASSWORD:-magazzino}
      PROGETTO: ${COMPOSE_PROJECT_NAME}
      TZ: Europe/Rome
    volumes:
      - ./backup:/backup
      - app_dati:/dati:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -o pipefail
        while true; do
          nome="/backup/$$PROGETTO-$$(date +%Y%m%d-%H%M).sql.gz"
          if pg_dump --no-owner --clean --if-exists | gzip > "$$nome.tmp"; then
            mv "$$nome.tmp" "$$nome"
            echo "Backup salvato: $$nome"
          else
            rm -f "$$nome.tmp"
            echo "ATTENZIONE: backup non riuscito"
          fi
          # Un allegato non cambia più dopo il caricamento: si copiano solo quelli nuovi,
          # saltando quelli dell'ultimo minuto che potrebbero essere ancora in scrittura.
          if [ -d /dati/allegati ]; then
            (cd /dati/allegati && find . -type f -mmin +1) | while IFS= read -r file; do
              copia="/backup/$$PROGETTO-allegati/$${file#./}"
              if [ ! -e "$$copia" ]; then
                mkdir -p "$$(dirname "$$copia")" \
                  && cp -p "/dati/allegati/$$file" "$$copia.tmp" \
                  && mv "$$copia.tmp" "$$copia" \
                  || echo "ATTENZIONE: copia non riuscita di $$file"
              fi
            done
          fi
          find /backup -maxdepth 1 -name "$$PROGETTO-*.sql.gz" -mtime +10 -delete
          sleep 1800
        done

  # Carica su Google Drive quello che c'è in ./backup. Facoltativo: finché non
  # è configurato (vedi README, "Backup su Google Drive") non fa niente.
  # Senza internet riprova da solo e recupera i file rimasti indietro.
  drive:
    image: rclone/rclone:1.75.1
    restart: unless-stopped
    environment:
      PROGETTO: ${COMPOSE_PROJECT_NAME}
      DRIVE_CARTELLA: ${DRIVE_CARTELLA:-Backup magazzino sagra}
      DRIVE_GIORNI: ${DRIVE_GIORNI:-30}
      TZ: Europe/Rome
    volumes:
      - ./backup:/backup:ro
      - ./rclone:/config/rclone
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -o pipefail
        stato=""
        while true; do
          if ! rclone listremotes 2>/dev/null | grep -qx "drive:"; then
            [ "$$stato" = "spento" ] || echo "Google Drive non configurato: i backup restano solo in ./backup."
            stato="spento"
          # Del registro di rclone si tengono solo i file copiati e l'eventuale errore finale.
          elif rclone mkdir "drive:$$DRIVE_CARTELLA" --retries 1 --log-level NOTICE \
               && rclone copy /backup "drive:$$DRIVE_CARTELLA" \
                 --filter "- *.tmp" --filter "+ /$$PROGETTO-*.sql.gz" --filter "+ /$$PROGETTO-allegati/**" --filter "- **" \
                 --retries 1 --stats 0 --log-level INFO 2>&1 | { grep -E "Copied|Failed" || true; }; then
            # Su Drive le copie del database si tengono più a lungo che sul computer.
            rclone delete "drive:$$DRIVE_CARTELLA" --filter "+ /$$PROGETTO-*.sql.gz" --filter "- **" \
              --min-age "$${DRIVE_GIORNI}d" --log-level NOTICE
            [ "$$stato" = "ok" ] || echo "Google Drive collegato: i backup vanno nella cartella «$$DRIVE_CARTELLA»."
            stato="ok"
          else
            [ "$$stato" = "errore" ] || echo "ATTENZIONE: copia su Google Drive non riuscita (manca internet?). Riprovo ogni 10 minuti."
            stato="errore"
          fi
          sleep 600
        done

volumes:
  db_dati:
  app_dati:
